spring.application.name=finance-collection-backend
server.port=${PORT:8080}

# Local default: file-based H2 (zero setup for development).
# In production (Railway), set these env vars to point at Supabase Postgres instead:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://<supabase-host>:5432/postgres?sslmode=require
#   SPRING_DATASOURCE_USERNAME=postgres
#   SPRING_DATASOURCE_PASSWORD=<your supabase db password>
#   SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
# Spring Boot automatically maps SPRING_DATASOURCE_* env vars over these defaults.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/fcms;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Hibernate auto-detects the correct dialect (H2 vs PostgreSQL) from the JDBC URL/driver,
# so no dialect is hardcoded here.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jackson.serialization.write-dates-as-timestamps=false
